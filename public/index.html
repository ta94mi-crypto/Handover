<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ניהול מסירות אתר</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="#/" class="brand">🏗️ ניהול מסירות</a>
      <nav class="nav">
        <a href="#/">מבנים</a>
        <a href="#/table">טבלת ליקויים</a>
        <a href="#/settings">מקצועות וקבלנים</a>
      </nav>
    </div>
  </header>
  <main id="app" class="app"></main>

  <div id="lightbox" class="lightbox hidden">
    <button class="lightbox-close" id="lightboxClose">✕</button>
    <img id="lightboxImg" src="" alt="" />
  </div>

  <div id="toast" class="toast hidden"></div>

  <script type="module">
    import * as pdfjsLib from '/vendor/pdfjs/pdf.min.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc = '/vendor/pdfjs/pdf.worker.min.mjs';

    window.pdfFirstPageToPngBlob = async function pdfFirstPageToPngBlob(file, maxDim = 1400) {
      const buffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
      const page = await pdf.getPage(1);
      const base = page.getViewport({ scale: 1 });
      const scale = Math.min(maxDim / base.width, maxDim / base.height, 3);
      const viewport = page.getViewport({ scale: Math.max(scale, 0.1) });
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(viewport.width);
      canvas.height = Math.round(viewport.height);
      await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
      return await new Promise((resolve, reject) => {
        canvas.toBlob((blob) => (blob ? resolve(blob) : reject(new Error('כשל בהמרת ה-PDF לתמונה'))), 'image/png');
      });
    };

    window.loadPdfFirstPage = async function loadPdfFirstPage(url) {
      const pdf = await pdfjsLib.getDocument(url).promise;
      return pdf.getPage(1);
    };
  </script>
  <script src="/app.js"></script>
</body>
</html>
